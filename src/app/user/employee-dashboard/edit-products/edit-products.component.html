<div *ngIf="isEmployee; else accessDenied" class="product-page">
  <button class="back-button" (click)="goBack()">← Zurück</button>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <ng-container *ngIf="product; else errorTpl">
    <div class="product-content">
      <div class="image-wrapper">
        <img [src]="'/assets/images/' + product.image" [alt]="product.name" class="product-image" />
      </div>

      <div class="info-wrapper">
        <h2 class="headline">Produkt bearbeiten</h2>

        <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="name">Produktname</label>
            <input type="text" id="name" formControlName="name" class="form-control">
          </div>

          <div class="form-group">
            <label for="description">Beschreibung</label>
            <textarea id="description" formControlName="description" class="form-control" rows="3"></textarea>
          </div>

          <div class="form-group">
            <label for="price">Preis (€)</label>
            <input type="number" id="price" formControlName="price" class="form-control" step="0.01" min="0">
          </div>

          <div class="form-group">
            <label for="stock_quantity">Lagerbestand</label>
            <input type="number" id="stock_quantity" formControlName="stock_quantity" class="form-control" min="0">
          </div>

          <div class="form-group">
            <label for="image">Bilddatei</label>
            <input type="text" id="image" formControlName="image" class="form-control">
          </div>

          <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">Speichern</button>
          <button type="button" class="btn btn-danger" (click)="deleteProduct()">
            Produkt löschen
          </button>
        </form>
        <div *ngIf="successMessage" class="alert alert-success">
          {{ successMessage }}
        </div>
      </div>
    </div>
  </ng-container>
</div>

<ng-template #errorTpl>
  <div class="product-content">
    <p>{{ error || 'Produkt nicht gefunden.' }}</p>
  </div>
</ng-template>

<ng-template #accessDenied>
  <div class="alert alert-warning">
    <p>Zugriff verweigert. Nur für Mitarbeiter.</p>
  </div>
</ng-template>

<ng-template #loading>
  <p class="loader">Lade Produkt...</p>
</ng-template>
