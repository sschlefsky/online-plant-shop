<div *ngIf="!(authService.isLoggedIn$ | async)">
  <form class="login-form" (ngSubmit)="onSubmit()">
    <h2 class="headline">Login</h2>

    <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="E-Mail" required />

    <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Passwort" required />

    <button type="submit">Login</button>

    <div *ngIf="error" style="color: red; text-align: center;">{{ error }}</div>

  </form>
</div>
